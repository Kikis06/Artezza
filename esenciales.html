<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esenciales | Artezza, joyería de acero</title>
  <meta name="description" content="Las piezas de todos los días: fáciles de combinar y pensadas para quedarse en tu joyero.">
  <meta name="theme-color" content="#3b2a24">
  <link rel="icon" href="img/marca/logo-artezza.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="coleccion" data-seccion="esenciales">
  <div id="cabecera"></div>

  <main id="contenido">
    <nav class="migas" aria-label="Ruta"><a href="index.html">Inicio</a> / <span aria-current="page">Esenciales</span></nav>
    <header class="coleccion-cabecera">
      <div>
        <p class="antetitulo">Línea permanente</p>
        <h1 id="tituloColeccion">Esenciales</h1>
        <p>Las piezas de todos los días: fáciles de combinar y pensadas para quedarse en tu joyero.</p>
      </div>
      <div class="coleccion-imagen"><img src="img/ambiente/argollas-piedra.jpg" alt=""></div>
    </header>
    <section class="coleccion" aria-labelledby="tituloColeccion">
      <div class="barra-filtros">
        <div class="filtros" id="filtros"></div>
        <div class="barra-orden">
          <label>Ordenar
            <select id="orden">
              <option value="destacados">Destacados</option>
              <option value="menor">Precio: menor a mayor</option>
              <option value="mayor">Precio: mayor a menor</option>
            </select>
          </label>
          <p class="resultados" id="resultados" aria-live="polite"></p>
        </div>
      </div>
      <ul class="rejilla" id="rejilla"></ul>
      <div class="vacio" id="vacio" hidden>
        <p>No encontramos piezas con esos filtros.</p>
        <button class="btn btn-secundario" id="limpiar" type="button">Limpiar filtros</button>
      </div>
    </section>
  </main>

  <div id="pie"></div>

  <script src="js/catalogo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
